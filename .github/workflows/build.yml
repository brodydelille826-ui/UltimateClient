
name: Build Ultimate Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Minecraft mod
        working-directory: UltimateClient-Fabric-26.2-cloud-build/UltimateClient-Fabric-26.2
        run: gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UltimateClient-JAR
          path: UltimateClient-Fabric-26.2/build/libs/*.jar
